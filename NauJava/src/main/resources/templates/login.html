<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
<h1>Вход в систему</h1>
<div th:if="${param.error}" style="color: red">Неверный логин или пароль</div>
<div th:if="${param.logout}" style="color: green">Вы вышли из системы</div>

<form th:action="@{/login}" method="post">
    <div><label> Логин: <input type="text" name="username" required/> </label></div>
    <div><label> Пароль: <input type="password" name="password" required/> </label></div>
    <div><input type="submit" value="Войти"/></div>
</form>
<p><a th:href="@{/registration}">Нет аккаунта? Зарегистрироваться</a></p>
</body>
</html>
