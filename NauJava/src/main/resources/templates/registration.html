<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
<div th:if="${message}">
    <div style="color: red" th:text="${message}"></div>
</div>
<h1>Регистрация</h1>
<form th:action="@{/registration}" method="post">
    <div><label> Логин: <input type="text" name="login" required/> </label></div>
    <div><label> Пароль: <input type="password" name="password" required/> </label></div>
    <div><label> Email: <input type="email" name="email"/> </label></div>
    <div><input type="submit" value="Зарегистрироваться"/></div>
</form>
<p><a th:href="@{/login}">Уже есть аккаунт? Войти</a></p>
</body>
</html>
